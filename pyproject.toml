[project]
name = "panda-agent"
version = "1.0.0"
description = "Panda Agent — 多行业智能调度 Agent，超越 Hermes"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "llama-cpp-python>=0.3.8",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "openai>=1.68.0",
    "boto3>=1.36.0",
    "schedule>=1.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.31.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["panda"]
