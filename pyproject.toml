[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-agent"
version = "1.2.0"
description = "🐼 Panda Agent — Self-Evolving AI Agent Framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "jialine"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "httpx>=0.27",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "tenacity>=8.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
feishu = [
    "lark-oapi>=1.5.3",
    "qrcode>=7.0",
]
telegram = [
    "python-telegram-bot>=20.0",
]
discord = [
    "discord.py>=2.0",
]
wechat = [
    "wechatpy>=1.8",
]
tui = [
    # TUI frontend is Node.js; no Python deps needed
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
panda = "panda.cli:main"

[project.urls]
Homepage = "https://gitee.com/jialine/panda-agent"
Repository = "https://gitee.com/jialine/panda-agent"

[tool.setuptools]
packages = [
    "panda",
    "panda.backup",
    "panda.debate",
    "panda.dispatch",
    "panda.explorer",
    "panda.gateway",
    "panda.guard",
    "panda.jury",
    "panda.mcp",
    "panda.memory",
    "panda.provider",
    "panda.router",
    "panda.skill",
    "panda.tool",
    "panda.tool.builtins",
    "panda.tui",
    "panda.utils",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
